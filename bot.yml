name: Run Bot
on:
  push:
  schedule:
    - cron: '*/30 * * * *' # 30分ごとに実行

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install discord.py supabase
      - name: Run Bot
        env:
          TOKEN: ${{ secrets.TOKEN }} # GitHubにトークンを登録する必要があります
        run: python main.py
